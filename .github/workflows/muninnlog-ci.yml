name: MuninnLog CI

on:
  push:
    branches: [master]
    paths:
      - "MuninnLog/**"
      - "hamlib_component/src/**"
      - "hamlib_component/test/FakeHamlibLoader.pas"
      - ".github/workflows/muninnlog-ci.yml"
  pull_request:
    paths:
      - "MuninnLog/**"
      - "hamlib_component/src/**"
      - "hamlib_component/test/FakeHamlibLoader.pas"
      - ".github/workflows/muninnlog-ci.yml"

permissions:
  contents: read

concurrency:
  group: muninnlog-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: MuninnLog
    steps:
      - uses: actions/checkout@v4

      # Toolchain: see MuninnLog/docs/adr/0001-toolchain.md
      - name: Install Free Pascal (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            fp-compiler fp-units-rtl fp-units-base fp-units-fcl fp-units-db \
            libsqlite3-0 libhamlib4t64

      - name: Install Free Pascal (macOS)
        if: runner.os == 'macOS'
        run: brew install fpc hamlib

      - name: Install Lazarus and Free Pascal (Windows)
        if: runner.os == 'Windows'
        uses: gcarreno/setup-lazarus@v3
        with:
          lazarus-version: "4.4"

      - name: Show toolchain
        run: |
          fpc -iV
          fpc -iTP
          fpc -iTO

      # SQLite: see MuninnLog/docs/adr/0003-storage-sqlite.md
      # Linux installs libsqlite3-0 above; macOS uses the system library.
      - name: Provide SQLite (Windows)
        if: runner.os == 'Windows'
        env:
          SQLITE_YEAR: "2025"
          SQLITE_VERSION: "3500400"
          SQLITE_SHA256: 56b8751cdbf6dcd8ac9a35508039e456692a402bc5ddf576c2b0eddb0fed8536
        run: |
          # The pinned hash is for the x64 DLL; setup-lazarus installs win64 FPC.
          if [ "$(fpc -iTP)" != x86_64 ]; then
            echo "Unsupported target: $(fpc -iTP)" >&2
            exit 1
          fi
          zip="sqlite-dll-win-x64-$SQLITE_VERSION.zip"
          dir=build/sqlite
          mkdir -p "$dir"
          curl --fail --silent --show-error --location --retry 3 \
            --output "$dir/$zip" "https://www.sqlite.org/$SQLITE_YEAR/$zip"
          echo "$SQLITE_SHA256 *$dir/$zip" | sha256sum --check
          7z x -y -o"$dir" "$dir/$zip" sqlite3.dll
          echo "MUNINN_SQLITE_LIBRARY=$(cygpath -w "$PWD/$dir/sqlite3.dll")" >> "$GITHUB_ENV"

      # Hamlib: see MuninnLog/docs/adr/0008-radio-port-hamlib.md
      # Linux and macOS install it above. The radio tests must not skip it.
      - name: Provide Hamlib (Windows)
        if: runner.os == 'Windows'
        env:
          HAMLIB_VERSION: "4.6.5"
          HAMLIB_SHA256: 2a7bfae280ec8aef1d42558b73eaef7f5f0d1dfa9fd8463c15adde5fdec63851
        run: |
          zip="hamlib-w64-$HAMLIB_VERSION.zip"
          dir=build/hamlib
          mkdir -p "$dir"
          curl --fail --silent --show-error --location --retry 3 \
            --output "$dir/$zip" \
            "https://github.com/Hamlib/Hamlib/releases/download/$HAMLIB_VERSION/$zip"
          echo "$HAMLIB_SHA256 *$dir/$zip" | sha256sum --check
          7z x -y -o"$dir" "$dir/$zip" "hamlib-w64-$HAMLIB_VERSION/bin/*.dll"
          # libhamlib-4.dll and the DLLs it needs are found on PATH.
          cygpath -w "$PWD/$dir/hamlib-w64-$HAMLIB_VERSION/bin" >> "$GITHUB_PATH"

      - name: Build muninn-cli
        run: scripts/build.sh

      - name: Run unit and integration tests
        env:
          MUNINN_TEST_RESULTS_DIR: build/test-results
          MUNINN_REQUIRE_HAMLIB: "1"
        run: scripts/test.sh

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: MuninnLog/build/test-results/
          if-no-files-found: ignore

      - name: Smoke test muninn-cli
        run: |
          output="$(./build/muninn-cli --version | tr -d '\r')"
          echo "$output"
          test "$output" = "MuninnLog 0.0.0"
          if ./build/muninn-cli --unknown-option; then
            echo "Unknown option must fail" >&2
            exit 1
          fi
